name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Style and static checks are platform-independent; run them once.
      - if: runner.os == 'Linux' && matrix.node == 24
        run: npm run lint
      - if: runner.os == 'Linux' && matrix.node == 24
        run: npm run format:check
      - run: npm test
        env:
          POINTERVIZ_REQUIRE_NATIVE: ${{ runner.os == 'Linux' && '1' || '' }}
      - run: npm run build
      - run: npm run build:instructor
      # The student build must not contain the Level editor.
      - run: npm run check:editions

  e2e:
    # Browser smoke tests against both production builds under the Pages subpath.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
